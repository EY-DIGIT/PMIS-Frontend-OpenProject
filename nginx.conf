user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    # ── GZIP compression ──────────────────────────────────────────
    # Vite builds minified JS/CSS — gzip compresses them another 70%.
    # On a 320ms VPN link this alone saves 5+ seconds on first load.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff
        font/woff2;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # ── Hashed assets (JS/CSS chunks) ─────────────────────────
        # Vite fingerprints filenames: main.a3f9c12.js
        # Safe to cache forever — content-addressed, never stale.
        # After first load, browser never re-downloads these.
        location ~* \.(js|css|woff|woff2|ttf|eot|svg|png|jpg|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ── index.html — never cache ──────────────────────────────
        # Must always be fresh so new deployments are picked up.
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # ── React Router — all routes serve index.html ────────────
        # Without this, refreshing /projects/123 returns 404.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
